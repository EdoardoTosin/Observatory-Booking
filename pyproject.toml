[project]
name = "observatory-booking"
version = "0.1.0"
description = "A Flask-based, self-hostable observatory booking web app with role-based access control, weather-aware scheduling, and encrypted user data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "python-dotenv>=1.2.2",
    "flask>=3.1.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "waitress>=3.0.2",
    "werkzeug>=3.1.8",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pylint>=4.0.6",
    "pytest>=8.4.0",
    "types-requests>=2.33.0.20260712",
    "types-waitress>=3.0.1.20260724",
]

docs = [
    "sphinx>=8.0.0",
    "pydata-sphinx-theme>=0.19.0",
    "sphinxcontrib-httpdomain>=2.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-openapi>=0.9.0",
]

[tool.pylint.MASTER]
init-hook = "import sys, os, glob; sp = glob.glob(os.path.join('.venv', 'Lib', 'site-packages')) + glob.glob(os.path.join('.venv', 'lib', 'python*', 'site-packages')); [sys.path.insert(0, p) for p in sp if p not in sys.path]"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
