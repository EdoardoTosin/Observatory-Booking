openapi: 3.0.3
info:
  title: Observatory Booking API
  version: "1.0.0"
  description: >
    Comprehensive API documentation grouped by role:
    - Public
    - Authenticated Users
    - Admins
    - Superadmins

    Most endpoints are server-rendered Jinja pages reached via normal form
    submissions. The `/api/v1/...` endpoints are a separate JSON API layer
    used for progressive-enhancement (filtering, pagination, bulk actions)
    on top of those same pages - see the "JSON API" tag below for their
    shared response envelope.

tags:
  - name: Public
    description: Endpoints accessible without authentication.
  - name: User
    description: Endpoints accessible to authenticated users.
  - name: Admin
    description: Endpoints for system administration and event management.
  - name: Superadmin
    description: Elevated admin endpoints for critical account operations.
  - name: JSON API
    description: >
      /api/v1/... endpoints returning a consistent {data, meta, errors}
      envelope, consumed via fetch() from the corresponding Jinja page for
      filtering/pagination/bulk actions without a full page reload.
  - name: Utility
    description: Static JavaScript files used by the web interface.

paths:

  /:
    get:
      tags: [public]
      summary: Homepage
      responses:
        '200':
          description: Rendered homepage

  /favicon.ico:
    get:
      tags: [public]
      summary: Favicon
      responses:
        '200':
          description: Returns favicon

  /contact:
    get:
      tags: [public]
      summary: Contact page
      responses:
        '200':
          description: Static contact page

  /faq:
    get:
      tags: [public]
      summary: FAQ page
      responses:
        '200':
          description: Static FAQ

  /terms_of_service:
    get:
      tags: [public]
      summary: Terms of Service page
      responses:
        '200':
          description: Static Terms page

  /privacy_policy:
    get:
      tags: [public]
      summary: Privacy Policy page
      responses:
        '200':
          description: Static Privacy Policy

  /cookie_policy:
    get:
      tags: [public]
      summary: Cookie Policy page
      responses:
        '200':
          description: Static Cookie Policy

  /login:
    get:
      tags: [Public]
      summary: Display the login form.
      responses:
        '200':
          description: Login page rendered.
    post:
      tags: [Public]
      summary: Authenticate a user and start a session.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '302':
          description: Redirects to dashboard on success.
        '400':
          description: Invalid credentials.

  /admin/user/delete:
    post:
      tags: [Superadmin]
      summary: Delete a user account.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: User account deleted.
        '403':
          description: Forbidden. Only superadmins allowed.
        '500':
          description: Deletion error.

  /register:
    get:
      tags: [Public]
      summary: Display the registration form.
      responses:
        '200':
          description: Registration page rendered.
    post:
      tags: [Public]
      summary: Register a new user.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '302':
          description: Redirect on successful registration.
        '400':
          description: Invalid input or user already exists.

  /logout:
    get:
      tags: [User]
      summary: Logout the current user.
      responses:
        '302':
          description: Redirected after logout.

  /events:
    get:
      tags: [User]
      summary: View and book available events.
      responses:
        '200':
          description: Event calendar data returned.

  /booking:
    post:
      tags: [User]
      summary: Book an event.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                _csrf_token:
                  type: string
      responses:
        '302':
          description: Redirect to /events with a flash message (confirmed, full, already booked, or already started).

  /cancel_booking/{event_id}:
    post:
      tags: [User]
      summary: Cancel an existing booking.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                _csrf_token:
                  type: string
      responses:
        '302':
          description: Redirect to /events with a flash message (cancelled, not found, or already started).

  /change_password:
    get:
      tags: [User]
      summary: Show the change password form.
      responses:
        '200':
          description: Change password form.
    post:
      tags: [User]
      summary: Update user password.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: Validation error or incorrect password.

  /admin:
    get:
      tags: [Admin]
      summary: Admin dashboard view.
      responses:
        '200':
          description: Dashboard HTML page.

  /admin/config:
    post:
      tags: [Admin]
      summary: Update system configuration.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Configuration updated.
        '400':
          description: Invalid config parameters.

  /admin/confirm_event:
    post:
      tags: [Admin]
      summary: Confirm a scheduled event.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event_id:
                  type: string
      responses:
        '200':
          description: Event confirmed.
        '404':
          description: Event not found.

  /admin/delete_event/{event_id}:
    post:
      tags: [Admin]
      summary: Delete a scheduled event.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event deleted.
        '404':
          description: Event not found.

  /admin/update_events_weather:
    get:
      tags: [Admin]
      summary: Refresh weather data for all events.
      responses:
        '200':
          description: Weather data updated.

  /admin/user/role:
    post:
      tags: [Admin]
      summary: Change a user's role.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Role updated.
        '403':
          description: Forbidden.

  /admin/user/block:
    post:
      tags: [Admin]
      summary: Block or unblock a user.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                block:
                  type: boolean
      responses:
        '200':
          description: User updated.
        '403':
          description: Not allowed.

  /api/v1/events:
    get:
      tags: [JSON API]
      summary: List events matching the same filters as the /events page.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Substring match on the event title.
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Show only this local calendar day; takes precedence over from/to.
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: avail
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Hide full or already-booked-by-user events.
        - name: no_warning
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Hide events with a weather warning.
        - name: sort
          in: query
          schema:
            type: string
            enum: [date_asc, date_desc, weather_desc]
        - name: month
          in: query
          schema:
            type: integer
          description: Month the date-picker widget should display (1-12).
        - name: year
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: >
            {data: [event...], meta: {count, date_range_clamped,
            calendar_year, calendar_month, calendar_days_with_events},
            errors: null}
        '401':
          description: Not logged in.

  /api/v1/admin/users:
    get:
      tags: [JSON API]
      summary: List users matching the same filters as the User Accounts tab.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 25
        - name: name
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
          description: >
            Substring search. Email is encrypted at rest, so this falls
            back to a decrypt-and-scan of the filtered candidate set
            instead of a SQL search (meta.email_search_scanned flags it).
        - name: role
          in: query
          schema:
            type: string
            enum: ["", User, Admin]
        - name: status
          in: query
          schema:
            type: string
            enum: ["", active, blocked]
        - name: sort
          in: query
          schema:
            type: string
            enum: [id_asc, id_desc, role, status, name_asc, name_desc]
      responses:
        '200':
          description: >
            {data: [{id, name, email, role, blocked}...], meta: {page,
            per_page, total, total_pages, email_search_scanned}, errors: null}
        '403':
          description: Not an admin.

  /api/v1/admin/users/bulk:
    post:
      tags: [JSON API]
      summary: Apply one action to a batch of users (page-scoped or every matching user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [block, unblock, role_user, role_admin]
                scope:
                  type: string
                  enum: [selected, all_matching]
                  default: selected
                user_ids:
                  type: array
                  items:
                    type: integer
                  description: Required when scope is "selected".
                filters:
                  type: object
                  description: >
                    Same shape as GET /api/v1/admin/users's query params.
                    Required when scope is "all_matching" - the acting
                    admin and any superadmin are always excluded server-side.
      responses:
        '200':
          description: "{data: {succeeded, skipped, failed}, errors: null}"
        '400':
          description: Invalid action, scope, or empty selection.

  /api/v1/admin/events:
    get:
      tags: [JSON API]
      summary: List events for a given (or the current) month.
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: >
            {data: [{id, effective_date, opening_time, closing_time,
            max_bookings, weather_rating, num_bookings, bookings, title,
            description}...], meta: {year, month}, errors: null}
        '403':
          description: Not an admin.

  /api/v1/admin/events/{event_id}/bookings/{booking_id}/revoke:
    post:
      tags: [JSON API]
      summary: >
        Revoke (delete) a single booking on an event. Unlike the
        user-facing self-cancel route, this is allowed even after the
        event has started, since it's a corrective admin action.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "{data: {num_bookings, bookings}, errors: null}"
        '404':
          description: Booking not found.

  /js/events.js:
    get:
      tags:
        - Utility
      summary: Serve events.js static script
      responses:
        '200':
          description: JavaScript file served successfully.
        '404':
          description: File not found.

  /js/change_password.js:
    get:
      tags:
        - Utility
      summary: Serve change_password.js static script
      responses:
        '200':
          description: JavaScript file served successfully.
        '404':
          description: File not found.

  /js/admin.js:
    get:
      tags: [Utility]
      summary: Serve admin.js static script
      responses:
        '200':
          description: JavaScript file served successfully.
        '404':
          description: File not found.

  /js/user_accounts.js:
    get:
      tags: [Utility]
      summary: Serve user_accounts.js static script
      responses:
        '200':
          description: JavaScript file served successfully.
        '404':
          description: File not found.

  /js/events_calendar.js:
    get:
      tags: [Utility]
      summary: Serve events_calendar.js static script
      responses:
        '200':
          description: JavaScript file served successfully.
        '404':
          description: File not found.

components:
  responses:
    NotFound:
      description: Resource not found (custom 404 page).
    Forbidden:
      description: Access denied (custom 403 page).
    InternalServerError:
      description: Unexpected server error (custom 500 page).
